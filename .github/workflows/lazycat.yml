name: LazyCat LPK
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
    # MiaoMiao private store only. LZC_API_TOKEN is required for LazyCat
    # image delivery (registry copy) even with the official store disabled.
    # Organization Secrets must authorize this repository; a same-name
    # Repository Secret overrides it.
    secrets:
      LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
